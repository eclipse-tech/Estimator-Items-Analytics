
version: "3.8"

services:
  backend:
    container_name: estimator-backend
    build:
      context: ./backend
      args:
        APP_ENVIRONMENT: ${env:-dev}
    environment:
      # Single source: used by scripts, APIs, and services throughout the project
      - APP_ENVIRONMENT=${env:-local}
      # SSH-tunnel MySQL (opt-in). Mount the pem key below.
      - ENABLE_SSH_TUNNEL=${ENABLE_SSH_TUNNEL:-1}
      - SSH_PKEY_PATH=${SSH_PKEY_PATH:-/run/secrets/shared-key.pem}
      # Timeout (seconds) for auth and data-fetch HTTP requests. Default 600 (10 min) for large payloads.
      - API_REQUEST_TIMEOUT=${API_REQUEST_TIMEOUT:-600}
      # For env=local in Docker: container → host MySQL (Mac/Windows: host.docker.internal)
      - MYSQL_HOST_OVERRIDE=${MYSQL_HOST_OVERRIDE:-host.docker.internal}
      # For env=local: container → host estimator API on port 8000
      - API_HOST_OVERRIDE=${API_HOST_OVERRIDE:-http://host.docker.internal:8000}

    volumes:
      #/Users/devserver/scripts/server_scripts/jumphost/prod-db-jump-host.pem:/run/secrets/shared-key.pem:ro
      - /Users/chayanchakraborty/Downloads/prod-jump-host.pem:/run/secrets/shared-key.pem:ro
      # Share backend/resources on host with /app/resources in container
      # /Users/chayanchakraborty/Documents/python_new_dir/Estimator-Items-Analytics/backend/resources:/app/resources
    ports:
      - "8090:8090"

  frontend:
    container_name: estimator-frontend
    build: ./frontend
    ports:
      - "2999:2999"

  qdrant:
    container_name: estimator-qdrant
    image: qdrant/qdrant
    ports:
      - "6333:6333"